<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>The Fallen Throne RPG</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <button class="menu-toggle" onclick="toggleMenu()">☰</button>
    <h1>The Fallen Throne RPG</h1>
    <p>Wiki oficial do RPG ambientado em Game of Thrones</p>
</header>

<div class="container">

    <!-- SIDEBAR -->
    <nav class="sidebar">
        <button onclick="loadSection('world')">🌍 O Mundo</button>
        <button onclick="loadSection('regions')">🗺️ Regiões</button>
        <button onclick="loadSection('classes')">⚔️ Classes</button>
        <button onclick="loadSection('systems')">📜 Sistemas</button>
        <button onclick="loadSection('market')">💰 Mercado</button>
        <button onclick="loadSection('organizations')">🏛️ Organizações</button>
        <button onclick="loadSection('events')">🔥 Eventos</button>
        <button onclick="loadSection('houses')">🦁 Casas de Westeros</button>
        <button onclick="loadSection('npcs')">👑 NPCs</button>
    </nav>

    <!-- CONTEÚDO DINÂMICO -->
    <main id="content">
        <h2>Bem-vindo ao The Fallen Throne RPG</h2>
        <p>Escolha uma aba ao lado para consultar informações do mundo.</p>
    </main>

</div>

<!-- =========================
     TEMPLATE CASAS DE WESTEROS
========================= -->
<template id="houses-template">

<section id="casas-westeros">

    <div class="houses-banner">
        <h2>Casas de Westeros</h2>
    </div>

    <!-- MENU INTERNO -->
    <div class="houses-menu">
        <button onclick="showHouses('grandes')">Grandes Casas</button>
        <button onclick="showHouses('menores')">Casas Menores</button>
        <button onclick="showHouses('extintas')">Casas Extintas</button>
    </div>

    <!-- GRANDES CASAS -->
    <section id="grandes" class="houses-section">

        <div class="houses-grid">

            <!-- STARK -->
            <div class="house-card">
                <div class="house-banner" style="background-image:url('https://wallpapers.com/images/hd/minimal-house-stark-sigil-banner-g8ncd2ql18y1iv01.jpg')"></div>
                <div class="house-content">
                    <div class="house-header">
                        <img src="https://static.wikia.nocookie.net/gameofthrones/images/5/5a/Casa-Stark-escudo.png/revision/latest?cb=20230216112818&path-prefix=pt-br">
                        <h3>Casa Stark</h3>
                    </div>
                    <p><strong>Lema:</strong> O Inverno Está Chegando</p>
                    <p><strong>Sede:</strong> Winterfell</p>
                    <p><strong>Região:</strong> O Norte</p>

                    <button class="house-button" onclick="openHouse('stark')">
                    Ver História
                    </button>

                </div>
            </div>

            <!-- LANNISTER -->
            <div class="house-card">
                <div class="house-banner" style="background-image:url('https://64.media.tumblr.com/f849903c9dfc20bb771b76f3e5c26e64/tumblr_inline_peg0tit2Gw1r0ewjx_1280.png')"></div>
                <div class="house-content">
                    <div class="house-header">
                        <img src="https://static.wikia.nocookie.net/sss/images/0/0a/Lannister.png/revision/latest?cb=20170809220120&path-prefix=pt-br">
                        <h3>Casa Lannister</h3>
                    </div>
                    <p><strong>Lema:</strong> Ouça-me Rugir</p>
                    <p><strong>Sede:</strong> Rochedo Casterly</p>
                    <p><strong>Região:</strong> Terras Ocidentais</p>

                    <button class="house-button" onclick="openHouse('lannister')">
                    Ver História
                    </button>
                </div>
            </div>

            <!-- TARGARYEN -->
            <div class="house-card">
                <div class="house-banner" style="background-image:url('https://i.imgur.com/2bMZ4hz.jpg')"></div>
                <div class="house-content">
                    <div class="house-header">
                        <img src="https://i.imgur.com/rXy6sZ6.png">
                        <h3>Casa Targaryen</h3>
                    </div>
                    <p><strong>Lema:</strong> Fogo e Sangue</p>
                    <p><strong>Sede:</strong> Dragonstone</p>

                    <button class="house-button" onclick="openHouse('targaryen')">
                    Ver História
                    </button>
                </div>
            </div>

        </div>
    </section>

    <!-- CASAS MENORES -->
    <section id="menores" class="houses-section hidden">
        <p>Casas menores serão listadas aqui.</p>
    </section>

    <!-- CASAS EXTINTAS -->
    <section id="extintas" class="houses-section hidden">
        <ul>
            <li>Casa Blackfyre</li>
            <li>Casa Frey</li>
        </ul>
    </section>

</section>
</template>

<!-- JS -->
<script src="js/script.js"></script>
<script src="data/world.js"></script>
<script src="data/regions.js"></script>
<script src="data/classes.js"></script>
<script src="data/systems.js"></script>
<script src="data/houses.js"></script>
<script src="data/housePages.js"></script>
<script src="data/npcs.js"></script>
<script src="data/market.js"></script>

</body>
</html>
